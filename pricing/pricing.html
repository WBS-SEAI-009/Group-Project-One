<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>

    <div class="price-card">
      <img src="plan.2.png" alt="Premium plan - $99 per month">
    </div>
  </div>

</html>
